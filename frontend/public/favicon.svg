        fill="#fff" opacity=".75"/>
  <!-- Smaller accent star, bottom-left. -->
  <path d="M8 22 L8.3 23.2 L9.5 23.5 L8.3 23.8 L8 25 L7.7 23.8 L6.5 23.5 L7.7 23.2 Z"
        fill="#fff" opacity=".55"/>
</svg>
