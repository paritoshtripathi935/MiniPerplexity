<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="PaidPilot">
  <!-- Brand-coloured rounded square. Matches CSS var --brand (#4F46E5). -->
  <rect width="32" height="32" rx="7" fill="#4F46E5"/>
  <!-- Four-point sparkle / north star — matches the in-app brand mark. -->
  <path d="M16 6 L17.6 13.5 L25 15 L17.6 16.5 L16 24 L14.4 16.5 L7 15 L14.4 13.5 Z"
        fill="#fff"/>
  <!-- Small accent star, top-right. -->
