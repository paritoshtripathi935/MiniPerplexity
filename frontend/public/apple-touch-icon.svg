<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" role="img" aria-label="PaidPilot">
  <!-- iOS home-screen icon (180x180). No transparency / no rounded corners:
       iOS clips a square and applies the OS's own rounded-corner mask. -->
  <rect width="180" height="180" fill="#6750A4"/>
  <!-- Concept 1 silhouette, recentred for the 180x180 canvas with breathing
       room. Original path scaled from 256-viewBox → 180-viewBox uses the
       transform 90/128 ≈ 0.703 around (128, 128). The transform is baked
       into the coords below so the SVG stays a flat single-path. -->
  <path d="M51 34H104C126 34 144 51.8 144 73.8C144 95.8 126 113.5 104 113.5H73L51 145.5V34Z"
        fill="#FFFFFF"/>
</svg>
